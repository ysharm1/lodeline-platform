name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lodeline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lodeline_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lodeline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE lodeline_e2e_test'
      - name: e2e (all 8 steps, offline; email to a file outbox, fake Stripe API)
        run: npm run e2e
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lodeline_e2e_test
